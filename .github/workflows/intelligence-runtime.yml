name: Intelligence Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/intelligence-runtime/**'
      - 'docs/intelligence-runtime-*.md'
      - '.github/workflows/intelligence-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/intelligence-runtime/**'
      - 'docs/intelligence-runtime-*.md'
      - '.github/workflows/intelligence-runtime.yml'

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared runtime
        run: npm run build --workspace=@stelthion/intelligence-runtime

      - name: Lint shared runtime
        run: npm run lint --workspace=@stelthion/intelligence-runtime

      - name: Typecheck shared runtime
        run: npm run typecheck --workspace=@stelthion/intelligence-runtime

      - name: Test shared runtime
        run: npm test --workspace=@stelthion/intelligence-runtime
